{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Curator class forum">
    <title>{% block title %}Curator — Class Forum{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% url 'core:home' %}">Curator</a>
        <span class="brand-caption">Class Forum</span>
        <a class="account-nav" href="{% url 'accounts:login' %}">Sign in</a>
        <a class="account-nav" href="{% url 'accounts:register' %}">Create account</a>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script src="{% static 'js/site.js' %}" defer></script>
</body>
</html>
